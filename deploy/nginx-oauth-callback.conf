# Optional: a tidy paste-back page for the redirect URL. Paste inside the site's 'server { ... }' block (https),
# change the path if your redirect_uri differs, then: sudo nginx -t && sudo systemctl reload nginx
    # OAuth paste-back page for linkedin-poster (LinkedIn wants an https redirect URL). The query holds a
    # one-time code, so: no access log, no analytics, no caching. The owner copies the address and pastes it into auth_finish.
    location = /oauth/linkedin {
        access_log off;
        expires -1;
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Almost done</title><style>body{font:17px/1.5 system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 16px;color:#1d1d1f;background:#fafaf7}button{font:inherit;padding:.6em 1.2em;border-radius:8px;border:1px solid #1d1d1f;background:#fff;cursor:pointer}@media (prefers-color-scheme:dark){body{color:#eee;background:#141414}button{color:#eee;background:#222;border-color:#eee}}</style></head><body><h1>Almost done</h1><p>Copy this page\'s full address and paste it back where you started. It works once, within 30 minutes.</p><button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent=\'Copied\')">Copy address</button></body></html>';
    }
